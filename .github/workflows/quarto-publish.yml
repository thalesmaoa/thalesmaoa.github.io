on:
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- IMPORTA SLIDES DO REPO PRIVADO ---
      - name: Checkout rendered slides
        uses: actions/checkout@v4
        with:
          repository: thalesmaoa/roteiro-estudo
          ref: rendered
          token: ${{ secrets.ROTEIRO_REPO_TOKEN }}
          path: _roteiro-rendered

      # --- IMPORTA FERRAMENTAS DO REPO ee-web-tools ---
      # Usa o mesmo token cross-repo do roteiro-estudo
      - name: Checkout EE Web Tools
        uses: actions/checkout@v4
        with:
          repository: thalesmaoa/ee-web-tools
          ref: main
          token: ${{ secrets.ROTEIRO_REPO_TOKEN }}
          path: _ee-web-tools

      # --- PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml

      # --- QUARTO RENDER ---
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: |
          quarto render

      # --- COPIA SLIDES APÓS O RENDER (evita que o .gitignore do Quarto bloqueie) ---
      - name: Copy rendered slides into docs
        run: |
          DEST="docs/pages/teaching/livros/cotrim"
          mkdir -p "$DEST"
          SRC="_roteiro-rendered/cotrim-sistemas-eletricos"
          cp -r "$SRC"/Cap*  "$DEST/" 2>/dev/null || true
          cp -r "$SRC"/Ap*   "$DEST/" 2>/dev/null || true
          cp    "$SRC"/*.css "$DEST/" 2>/dev/null || true
          cp    "$SRC"/favicon.png "$DEST/" 2>/dev/null || true
          echo "Slides copiados para docs/$DEST"

      # --- COPIA FERRAMENTAS APÓS O RENDER (só as pastas dos apps,
      #     sem sobrescrever o index da vitrine em docs/tools/) ---
      - name: Copy EE Web Tools into docs
        run: |
          DEST="docs/tools"
          mkdir -p "$DEST"
          cp -r _ee-web-tools/winding-calculator "$DEST/winding-factor"
          echo "Ferramenta copiada para docs/$DEST/winding-factor"

      # --- SITEMAP: adiciona as ferramentas copiadas (não são
      #     renderizadas pelo Quarto, então não entram sozinhas) ---
      - name: Append imported tools to sitemap
        run: |
          python - <<'EOF'
          import glob
          base = "https://thalesmaia.com/"
          sitemap = "docs/sitemap.xml"
          urls = [
              base + f[len("docs/"):]
              for f in sorted(glob.glob("docs/tools/**/index.html", recursive=True))
              if f != "docs/tools/index.html"
          ]
          if urls:
              with open(sitemap) as fh:
                  content = fh.read()
              entries = "".join(f"  <url>\n    <loc>{u}</loc>\n  </url>\n" for u in urls)
              with open(sitemap, "w") as fh:
                  fh.write(content.replace("</urlset>", entries + "</urlset>"))
              print(f"Sitemap atualizado: {len(urls)} ferramenta(s)")
          else:
              print("Nenhuma ferramenta importada; sitemap inalterado")
          EOF

      # --- PUBLICA ---
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          force_orphan: true
