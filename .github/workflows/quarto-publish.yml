on:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- IMPORTA SLIDES DO REPO PRIVADO ---
      - name: Checkout rendered slides
        uses: actions/checkout@v4
        with:
          repository: thalesmaoa/roteiro-estudo
          ref: rendered
          token: ${{ secrets.ROTEIRO_REPO_TOKEN }}
          path: _roteiro-rendered

      - name: Copy rendered slides into site
        run: |
          DEST="pages/teaching/livros/cotrim"
          # Copia diretórios de capítulos (Cap1, Cap2, ..., ApA, ApB) e CSS
          cp -r _roteiro-rendered/Cap*  "$DEST/" 2>/dev/null || true
          cp -r _roteiro-rendered/Ap*   "$DEST/" 2>/dev/null || true
          cp    _roteiro-rendered/*.css "$DEST/" 2>/dev/null || true
          echo "Slides copiados para $DEST"
      # ----------------------------------------

      # --- NOVOS PASSOS PARA O PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Você pode ajustar para a versão que costuma usar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Substitua os nomes abaixo pelas bibliotecas exatas que o seu xlsx_to_yml.py precisa:
          pip install pandas openpyxl pyyaml 
          
          # Se você tiver um arquivo requirements.txt no repositório, apague o comando de cima e use este:
          # pip install -r requirements.txt
      # ----------------------------------

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}