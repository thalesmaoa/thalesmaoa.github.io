on:
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- IMPORTA SLIDES DO REPO PRIVADO ---
      - name: Checkout rendered slides
        uses: actions/checkout@v4
        with:
          repository: thalesmaoa/roteiro-estudo
          ref: rendered
          token: ${{ secrets.ROTEIRO_REPO_TOKEN }}
          path: _roteiro-rendered

      # --- PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml

      # --- QUARTO RENDER ---
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: |
          quarto render

      # --- COPIA SLIDES APÓS O RENDER (evita que o .gitignore do Quarto bloqueie) ---
      - name: Copy rendered slides into docs
        run: |
          DEST="docs/pages/teaching/livros/cotrim"
          mkdir -p "$DEST"
          SRC="_roteiro-rendered/cotrim-sistemas-eletricos"
          cp -r "$SRC"/Cap*  "$DEST/" 2>/dev/null || true
          cp -r "$SRC"/Ap*   "$DEST/" 2>/dev/null || true
          cp    "$SRC"/*.css "$DEST/" 2>/dev/null || true
          echo "Slides copiados para docs/$DEST"

      # --- PUBLICA ---
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          force_orphan: true
