<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" font-family="Latin Modern Roman, Georgia, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="280" fill="#ffffff"/>

  <!-- Boxes -->
  <g stroke="#2c3e50" stroke-width="2" fill="#eef4f9">
    <rect x="30"  y="60" width="150" height="90" rx="8"/>
    <rect x="270" y="60" width="180" height="90" rx="8"/>
    <rect x="540" y="60" width="150" height="90" rx="8"/>
    <rect x="780" y="60" width="190" height="90" rx="8"/>
  </g>

  <g font-size="22" fill="#2c3e50" text-anchor="middle" font-weight="bold">
    <text x="105" y="100">Motor</text>
    <text x="105" y="126" font-size="15" font-weight="normal">selecionado</text>

    <text x="360" y="100">Correntes de</text>
    <text x="360" y="126">alimentação</text>

    <text x="615" y="100">Cabos de</text>
    <text x="615" y="126">potência</text>

    <text x="875" y="100">Sistema de</text>
    <text x="875" y="126">proteção</text>
  </g>

  <!-- Arrows between boxes -->
  <g stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="182" y1="105" x2="266" y2="105"/>
    <line x1="452" y1="105" x2="536" y2="105"/>
    <line x1="692" y1="105" x2="776" y2="105"/>
  </g>

  <!-- SEP box below, fed by the whole chain -->
  <rect x="330" y="210" width="340" height="60" rx="8" stroke="#2c3e50" stroke-width="2" fill="#dfeaf3"/>
  <text x="500" y="237" font-size="20" fill="#2c3e50" text-anchor="middle" font-weight="bold">Sistema Elétrico de Potência (SEP)</text>
  <text x="500" y="258" font-size="14" fill="#2c3e50" text-anchor="middle">transformadores, geradores, subestações</text>

  <line x1="875" y1="150" x2="875" y2="190" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="875" y1="190" x2="500" y2="190" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="500" y1="190" x2="500" y2="206" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Top labels: what defines what -->
  <g font-size="13" fill="#5b6f82" text-anchor="middle" font-style="italic">
    <text x="223" y="50">define</text>
    <text x="494" y="50">dimensiona</text>
    <text x="734" y="50">dimensiona</text>
  </g>
</svg>
