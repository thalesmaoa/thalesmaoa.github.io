<script>
(function() {
  const LANG_KEY = 'site-lang';

  // Restaura preferência salva ou detecta idioma do navegador
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === 'en') {
    document.documentElement.classList.add('lang-en');
  } else if (saved === 'pt') {
    // pt é o default, não precisa adicionar classe
  } else {
    // Nenhuma preferência salva: detecta idioma do navegador
    const browserLang = navigator.language || navigator.userLanguage || '';
    if (browserLang.startsWith('en')) {
      document.documentElement.classList.add('lang-en');
      localStorage.setItem(LANG_KEY, 'en');
    } else if (browserLang.startsWith('pt')) {
      localStorage.setItem(LANG_KEY, 'pt');
    } else {
      // outros idiomas: default EN
      document.documentElement.classList.add('lang-en');
      localStorage.setItem(LANG_KEY, 'en');
    }
  }

  // Corrige <title> e OG tags lendo do <h1> (que tem os <span> preservados)
  function applyTitleTranslation(lang) {
    var h1 = document.querySelector('h1.title');
    if (!h1) return;
    var span = h1.querySelector('.lang-' + lang);
    if (!span) return;
    var title = span.textContent.trim();
    var suffix = (document.title.match(/ – .+$/) || [''])[0];
    document.title = title + suffix;
    var og = document.querySelector('meta[property="og:title"]');
    if (og) og.setAttribute('content', title + suffix);
    var tw = document.querySelector('meta[name="twitter:title"]');
    if (tw) tw.setAttribute('content', title + suffix);
  }

  // Aplica no carregamento
  var currentLang = document.documentElement.classList.contains('lang-en') ? 'en' : 'pt';
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { applyTitleTranslation(currentLang); });
  } else {
    applyTitleTranslation(currentLang);
  }

  function insertToggle() {
    // Encontra o <ul> direito da navbar do Quarto
    const rightNav = document.querySelector('.navbar-nav.ms-auto');
    if (!rightNav) return;

    const li = document.createElement('li');
    li.className = 'nav-item';

    const a = document.createElement('a');
    a.className = 'nav-link nav-lang-toggle';
    a.href = '#';
    a.setAttribute('aria-label', 'Switch language');
    a.innerHTML = '<span class="lang-pt">PT</span><span class="lang-en">EN</span>';

    a.addEventListener('click', function(e) {
      e.preventDefault();
      var isEn = document.documentElement.classList.toggle('lang-en');
      var lang = isEn ? 'en' : 'pt';
      localStorage.setItem(LANG_KEY, lang);
      applyTitleTranslation(lang);
    });

    li.appendChild(a);
    rightNav.appendChild(li);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', insertToggle);
  } else {
    insertToggle();
  }
})();
</script>
